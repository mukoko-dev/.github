version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Africa/Harare
    open-pull-requests-limit: 1
    reviewers:
      - bryanfawcett
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: build
      include: scope
    groups:
      all:
        patterns: ['*']
        update-types: [major, minor, patch]
