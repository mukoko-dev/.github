# Marks abandoned issues and PRs stale on a schedule.

name: Stale

on:
  schedule:
    - cron: '23 1 * * *'
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    uses: nyuchi/.github/.github/workflows/reusable-stale.yml@bb87d28e55c0c3c385121113900b698eb6ce8ab2  # v0.5.0
