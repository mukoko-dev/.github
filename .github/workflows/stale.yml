# Marks abandoned issues and PRs stale on a schedule.

name: Stale

on:
  schedule:
    - cron: '23 1 * * *'
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    uses: nyuchi/.github/.github/workflows/reusable-stale.yml@c2e2506a4eadf67fbf824b41720aa220c539fc21  # v0.7.0
