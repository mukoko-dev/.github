# Conventional-Commits check on the PR title.
#
# Both org rulesets allow squash merges only, so the PR title becomes the
# commit subject on main. Linting it here is what keeps main's history
# machine-readable for release tooling.

name: PR title

on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize]
  # Required checks must also report on a merge queue's gh-readonly-queue/**
  # ref, or a queued PR waits until the queue times it out. The lint job skips
  # itself there (no PR, no title) and a skipped check counts as passed.
  merge_group:

permissions:
  pull-requests: read
  statuses: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    uses: nyuchi/.github/.github/workflows/reusable-pr-title-lint.yml@bb87d28e55c0c3c385121113900b698eb6ce8ab2  # v0.5.0
