# This repository's own shift-left security, and the test of the reusable
# workflows it publishes: it calls them by LOCAL path, so a pull request that
# changes one runs the changed version. Other repositories call them at
# mukoko-dev/.github/...@main (see workflow-templates/security.yml).
#
# There is no dependency audit here: this repository has no Cargo.toml and
# no JS lockfile, and the audit fails on purpose when it has nothing to
# audit. CodeQL scans the workflow files (`actions`).

name: Security

on:
  push:
    branches: [main, staging]
  pull_request:
  merge_group:
  schedule:
    - cron: '41 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dependency-review:
    uses: ./.github/workflows/reusable-dependency-review.yml

  codeql:
    uses: ./.github/workflows/reusable-codeql.yml
    permissions:
      actions: read
      contents: read
      security-events: write
    with:
      languages: actions
