# Pre-commit hooks: the commit layer of shift-left security (#17), so a
# problem is caught on the developer's machine before it reaches Git or CI.
#
#   pipx install pre-commit   # or: pip install pre-commit
#   pre-commit install        # once per clone; then it runs on every commit
#   pre-commit run --all-files
#
# Each hook runs on the staged files only. The same checks run again in CI
# (org-lint.yml, and the enterprise-required Semgrep and dependency review),
# so skipping a hook locally never skips the gate; it only finds out later.
#
# Every `rev` is a commit SHA with its tag beside it, like the actions in
# .github/workflows/. The linter versions match the ones reusable-lint.yml
# pins in CI, so local and CI results agree.

exclude: ^profile/canonical/  # the Founder's text, committed byte-for-byte

repos:
  # Secrets: the check that matters most before a commit, because a secret
  # that reaches a pushed commit has to be rotated, not just deleted.
  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e  # frozen: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      - id: detect-private-key
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: check-json

  - repo: https://github.com/rhysd/actionlint
    rev: 914e7df21a07ef503a81201c76d2b11c789d3fca  # frozen: v1.7.12
    hooks:
      - id: actionlint

  - repo: https://github.com/adrienverge/yamllint
    rev: cba56bcde1fdd01c1deb3f945e69764c291a6530  # frozen: v1.38.0
    hooks:
      - id: yamllint
        args: [--strict]

  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: b82a6c8896e491b9cb377a99ff3412131920681b  # frozen: v0.23.2
    hooks:
      - id: markdownlint-cli2
